<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>the luminarium — a walk-through</title>
<meta name="description" content="a small house of rooms. open a door, tell me what is serving you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161a;
    --paper:#f2f4f1;
    --note:#fffdf6;
    --cyan:#18c3d6;
    --cyan-deep:#0b8fa0;
    --muted:#586270;
    --line:rgba(40,80,105,.10);
    --door:#1b2230;
    --glow:#bff3f8;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Newsreader',Georgia,serif;font-size:1.15rem;line-height:1.6;min-height:100vh;
    overflow-x:hidden;
  }
  .defs{position:absolute;width:0;height:0;overflow:hidden}

  /* painted wall: watercolor wash + grid paper + paper grain */
  :root{--w1:rgba(120,160,192,.34);--w2:rgba(168,198,176,.30);--w3:rgba(206,170,186,.24);--w4:rgba(150,170,205,.26)}
  html[data-room="monday"]{--w1:rgba(231,160,176,.34);--w2:rgba(255,214,170,.30);--w3:rgba(250,225,170,.22);--w4:rgba(240,180,200,.24)}
  html[data-room="margins"]{--w1:rgba(120,135,200,.34);--w2:rgba(170,150,205,.28);--w3:rgba(255,225,160,.20);--w4:rgba(110,130,190,.26)}
  html[data-room="field"]{--w1:rgba(100,200,210,.34);--w2:rgba(170,215,180,.30);--w3:rgba(150,225,235,.22);--w4:rgba(120,190,200,.26)}
  html[data-room="library"]{--w1:rgba(150,195,170,.34);--w2:rgba(215,235,190,.30);--w3:rgba(170,210,200,.22);--w4:rgba(140,190,160,.26)}
  html[data-room="scrap"]{--w1:rgba(240,150,125,.32);--w2:rgba(255,205,185,.30);--w3:rgba(215,190,240,.22);--w4:rgba(245,170,150,.24)}
  html[data-room="lantern"]{--w1:rgba(255,170,100,.30);--w2:rgba(190,120,150,.28);--w3:rgba(120,100,180,.24);--w4:rgba(255,200,130,.26)}
  body::before{
    content:"";position:fixed;inset:0;z-index:-3;
    background:
      radial-gradient(60% 45% at 14% 10%, var(--w1), transparent 75%),
      radial-gradient(55% 42% at 90% 28%, var(--w2), transparent 75%),
      radial-gradient(65% 45% at 30% 94%, var(--w3), transparent 75%),
      radial-gradient(50% 38% at 82% 88%, var(--w4), transparent 75%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:28px 28px;
  }
  .grain{
    position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.55;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .25 0 0 0 0 .28 0 0 0 0 .3 0 0 0 .22 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 80px}
  .mast{
    background:var(--ink);color:#e9eef0;border-bottom:3px solid var(--cyan);
    font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.04em;
    padding:10px 14px;display:flex;justify-content:space-between;gap:12px;
  }
  .mast b{font-weight:500;color:var(--cyan)}
  .mast-r{display:flex;align-items:center;gap:14px}
  .mast button{font:inherit;color:var(--cyan);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .mast button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

  .view{animation:arrive .7s ease both}
  @keyframes arrive{from{opacity:0}to{opacity:1}}

  .mono{font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.02em;color:var(--cyan-deep)}
  h1,h2{font-weight:400;font-style:italic;line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;outline:none}
  h1{font-size:clamp(2.4rem,9vw,3.7rem)}
  h2{font-size:clamp(1.9rem,6.5vw,2.5rem)}
  p{margin:0 0 14px}
  .center{text-align:center}
  .lede{max-width:34rem;margin-left:auto;margin-right:auto}
  .quiet{color:var(--muted);font-style:italic}

  /* ---------- doors ---------- */
  .door{
    position:relative;display:block;width:100%;aspect-ratio:220/340;padding:0;border:0;background:none;
    cursor:pointer;perspective:900px;-webkit-tap-highlight-color:transparent;color:inherit;font:inherit;
  }
  div.door{cursor:default}
  .door svg,.door img{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .d-back{transition:filter .5s}
  .d-leaf{
    transform-origin:9% 60%;transform-style:preserve-3d;
    transition:transform .95s cubic-bezier(.5,.05,.2,1);
    filter:drop-shadow(0 8px 10px rgba(20,22,26,.18));
  }
  .door .port{opacity:.55;transition:opacity .6s}
  .door.visited .port{opacity:1}
  button.door:hover .d-leaf,button.door:focus-visible .d-leaf{transform:rotateY(-26deg)}
  button.door:hover .d-back,button.door:focus-visible .d-back{filter:drop-shadow(0 0 16px var(--glow))}
  button.door:focus-visible{outline:3px solid var(--cyan);outline-offset:6px}
  .door.open .d-leaf{transform:rotateY(-84deg) !important}
  .door.open .d-back{filter:drop-shadow(0 0 28px var(--glow))}
  .door.idle .d-leaf{animation:ajar 6s ease-in-out infinite}
  @keyframes ajar{0%,100%{transform:rotateY(0)}50%{transform:rotateY(-7deg)}}
  button.door.idle:hover .d-leaf{animation:none}
  .door.beckon .d-back{animation:beckon 2.6s ease-in-out infinite}
  @keyframes beckon{0%,100%{filter:drop-shadow(0 0 0 var(--glow))}50%{filter:drop-shadow(0 0 22px var(--glow))}}
  .seal{
    position:absolute;right:-8px;top:10px;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--cyan-deep);background:rgba(255,253,246,.85);color:var(--cyan-deep);
    display:none;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem;
    transform:rotate(-12deg);z-index:2;
  }
  .door.answered .seal{display:grid;animation:stampIn .4s cubic-bezier(.2,1.6,.4,1) both}

  /* ---------- entry ---------- */
  .push{
    display:block;margin:0 auto;font-family:'IBM Plex Mono',monospace;font-size:.82rem;letter-spacing:.02em;
    background:var(--ink);color:var(--cyan);border:1px solid var(--ink);padding:14px 22px;cursor:pointer;
  }
  .push:hover{box-shadow:3px 3px 0 var(--cyan-deep);transform:translate(-2px,-2px)}
  .entry .q{max-width:30rem;margin:26px auto 28px}

  /* ---------- hall ---------- */
  .hall{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 24px;max-width:600px;margin:26px auto 10px}
  .cell{display:block}
  .cell:nth-child(even){margin-top:22px}
  .plate{
    margin-top:12px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.01em;color:var(--ink);
  }
  .plate i{font-style:normal;color:var(--cyan-deep);margin-right:6px}
  .lamps{display:flex;justify-content:center;gap:9px;margin:4px 0 0}
  .lamps span{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--note);transition:background .5s,box-shadow .5s}
  .lamps span.lit{background:var(--cyan);box-shadow:0 0 10px 2px rgba(24,195,214,.6)}
  @media (min-width:640px){
    .hall{grid-template-columns:repeat(3,1fr);max-width:700px}
    .cell:nth-child(even){margin-top:0}
    .cell:nth-child(3n+2){margin-top:26px}
  }

  /* ---------- rooms ---------- */
  .room{--r:0deg}
  .vista{
    position:relative;width:min(78%,330px);margin:30px auto 0;aspect-ratio:6/5;border-radius:999px 999px 4px 4px;overflow:hidden;isolation:isolate;
    background:var(--glow);
    box-shadow:0 0 0 7px var(--door),0 0 0 9px var(--ink),0 0 70px 12px var(--glow);
    animation:vistaIn 1s ease both;
  }
  @keyframes vistaIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .vista svg,.vista img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
  .vista::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 36px rgba(0,0,0,.28);border-radius:inherit;pointer-events:none}

  .note{
    position:relative;background:var(--note);border:1px solid var(--ink);box-shadow:6px 6px 0 rgba(20,22,26,.9);
    padding:36px 22px 22px;margin-top:-16px;transform:rotate(-.3deg);
  }
  .tape{position:absolute;top:-17px;height:auto;pointer-events:none;mix-blend-mode:multiply;opacity:.94;filter:drop-shadow(0 2px 2px rgba(20,22,26,.2));z-index:2}
  .tape.a{left:12px;transform:rotate(-6deg)}
  .tape.b{right:12px;transform:rotate(5deg)}
  .deco{height:auto;filter:drop-shadow(1px 2px 2px rgba(20,22,26,.28));transform:rotate(var(--rot,0deg));animation:stick .7s .35s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none;user-select:none}
  .deco.r{float:right;margin:0 -8px 8px 14px}
  .deco.l{float:left;margin:0 14px 8px -8px}
  .deco.blk{display:block;float:none;margin:-6px -8px 10px auto}
  @keyframes stick{from{opacity:0;transform:rotate(calc(var(--rot,0deg) + 14deg)) scale(1.5)}to{opacity:1;transform:rotate(var(--rot,0deg)) scale(1)}}
  .note .mono{display:block;margin-bottom:6px}
  .linkbtn{
    display:inline-block;margin:4px 0 6px;padding:10px 14px;text-decoration:none;
    font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--ink);background:var(--glow);border:1px solid var(--ink);
  }
  .linkbtn:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-2px,-2px)}

  .q{margin:28px 0 0;padding:0;border:0;min-width:0;clear:both}
  .q legend,.q > label.qt{display:block;padding:0;margin-bottom:14px;font-size:1.14rem;font-style:italic}
  .q .tagline{display:block;font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:.74rem;color:var(--cyan-deep);margin-bottom:3px}
  .reveal{animation:unfold .55s cubic-bezier(.3,1.2,.5,1) both;transform-origin:top}
  @keyframes unfold{from{opacity:0;transform:translateY(-10px) scaleY(.92)}to{opacity:1;transform:none}}

  /* answer tags */
  .tagrow{position:relative;margin:0 0 11px;transform:rotate(var(--r,0deg));transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
  .tagwrap{
    display:block;
    filter:drop-shadow(1.4px 0 0 var(--ink)) drop-shadow(-1.4px 0 0 var(--ink)) drop-shadow(0 1.4px 0 var(--ink)) drop-shadow(0 -1.4px 0 var(--ink)) drop-shadow(3px 4px 0 rgba(20,22,26,.14));
  }
  .tag{
    display:block;width:100%;text-align:left;font:inherit;font-size:1.03rem;line-height:1.35;color:var(--ink);
    background:#fff;border:0;padding:13px 56px 13px 46px;cursor:pointer;position:relative;
    clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%);transition:background .3s;
  }
  .tag::before{
    content:"";position:absolute;left:15px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;
    background:#dfe5e1;box-shadow:inset 0 0 0 1.5px var(--ink);
  }
  .tagrow:hover{transform:rotate(0) translate(-2px,-2px)}
  .tagrow.on{transform:rotate(0) translateX(9px)}
  .tagrow.on .tag{background:var(--glow)}
  .tag:focus-visible{outline:3px solid var(--cyan)}
  .stamp{
    position:absolute;right:6px;top:50%;width:44px;height:44px;margin-top:-22px;border:2px solid var(--cyan-deep);border-radius:50%;
    color:var(--cyan-deep);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
    transform:rotate(-14deg) scale(0);opacity:0;pointer-events:none;mix-blend-mode:multiply;
  }
  .stamp::before{content:"";position:absolute;inset:3px;border:1px dashed var(--cyan-deep);border-radius:50%}
  .tagrow.on .stamp{animation:stampIn .4s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes stampIn{0%{transform:rotate(-34deg) scale(2.6);opacity:0}55%{opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:.92}}

  /* writing slips */
  .slip{
    width:100%;font:inherit;font-size:1.05rem;line-height:32px;color:var(--ink);display:block;
    background:#fffdf6 repeating-linear-gradient(transparent,transparent 31px,rgba(24,195,214,.38) 31px,rgba(24,195,214,.38) 32px);
    background-attachment:local;border:1.5px solid var(--ink);padding:0 14px;border-radius:0;resize:vertical;
    box-shadow:4px 4px 0 rgba(20,22,26,.9);transform:rotate(-.35deg);
  }
  input.slip{height:46px;line-height:44px}
  .slip:focus{outline:3px solid var(--cyan);outline-offset:2px}
  .hint{font-size:.92rem;color:var(--muted);margin:10px 0 0}

  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;flex-wrap:wrap}
  .go{
    font-family:'IBM Plex Mono',monospace;font-size:.84rem;background:var(--ink);color:var(--cyan);
    border:1px solid var(--ink);padding:14px 20px;cursor:pointer;transition:transform .15s,box-shadow .15s;
  }
  .go:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--cyan-deep)}
  .go:disabled{opacity:.5;cursor:wait}
  .back{
    font-family:'IBM Plex Mono',monospace;font-size:.8rem;background:none;border:0;color:var(--muted);
    cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px;
  }
  .go:focus-visible,.back:focus-visible,.push:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .error{color:#8c1d2b;margin:14px 0 0;font-size:.98rem}
  .note-preview{
    font-family:'IBM Plex Mono',monospace;font-size:.74rem;background:#fff6d9;border:1px dashed #b59a2b;color:#5c4d0b;
    padding:8px 10px;margin-top:18px;
  }
  .note.sending{animation:slide .9s cubic-bezier(.5,0,.8,.4) forwards}
  @keyframes slide{to{transform:translateY(46px) rotate(1.2deg) scale(.96);opacity:0}}

  .poem{margin:22px auto;padding:6px 0 6px 18px;border-left:3px solid var(--cyan);font-style:italic;font-size:1.22rem;line-height:1.7;display:inline-block;text-align:left}
  .foot{text-align:center;margin-top:34px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted)}

  /* portal: light that floods through the open door */
  .portal{position:fixed;inset:0;z-index:100;display:none}

  /* lantern flame */
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate}
  .flame.f2{animation-duration:.9s;animation-delay:-.35s}
  .flame.f3{animation-duration:.7s;animation-delay:-.2s}
  @keyframes flick{from{transform:scale(1,1) skewX(-2deg)}to{transform:scale(.91,1.13) skewX(3deg)}}
  .ember{animation:rise 3.4s ease-in infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}

  /* lite mode: phones and in-app viewers that struggle with heavy SVG filters (add ?lite=1 to force, ?full=1 to override) */
  .lite [filter]{filter:none !important}
  .lite [filter="url(#soft)"]{display:none}
  .lite .d-leaf,.lite .deco,.lite .tape,.lite .tagwrap{filter:none}
  .lite .tag{clip-path:none;border-radius:4px 14px 14px 4px;box-shadow:inset 0 0 0 1.5px var(--ink),3px 4px 0 rgba(20,22,26,.14)}
  .lite .tag::before{left:13px}
  .lite .vista{box-shadow:0 0 0 7px var(--door),0 0 0 9px var(--ink)}
  [hidden]{display:none !important}
  @media (max-width:520px){
    body{font-size:1.08rem}
    .note{padding:34px 16px 18px;box-shadow:4px 4px 0 rgba(20,22,26,.9)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.5"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
</svg>
<div class="grain"></div>
<div class="wrap">
  <div class="mast"><span><b>the luminarium</b></span><span class="mast-r"><button type="button" id="hallBtn" hidden>← the hall</button><span id="count" aria-live="polite"></span></span></div>
  <main id="stage"></main>
</div>
<div class="portal" id="portal"></div>

<script>
(function(){
  "use strict";

  (function(){
    var ua = navigator.userAgent || "", qs = location.search || "";
    var touchWebKit = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if((touchWebKit && !/[?&]full=1/.test(qs)) || /[?&]lite=1/.test(qs)) document.documentElement.classList.add("lite");
  })();

  /* ============ settings ============
     ENDPOINT: paste either a Google Apps Script web-app link (answers land in your own Google Sheet; see README)
     or a Formspree form URL, e.g. "https://formspree.io/f/abcdwxyz"
     Leave it empty to test: nothing is sent, answers log to the browser console.

     ART: drop your own artwork in an /art folder next to this file, then put the file names here.
       door.<room>  : a closed door, transparent PNG (cut out), portrait, about 2:3
       scene.<room> : the painting you see through the window inside that room (JPG/PNG), about 6:5
     Leave a slot as "" and the painted placeholder is used instead.
     Rooms: front, monday, margins, field, library, scrap, lantern */
  var CFG = {
    ENDPOINT:"https://script.google.com/macros/s/AKfycbyILshpBW6wHEe16pKga8tYne_KRVGwQQveQhHjj2QvQCiZYY2B2ssA0cQLkAk3rKg/exec",
    SCRAP_URL: "https://rainesillito-tree.github.io/scrapnaturalist/",
    SUBSTACK_URL: "https://rainesillito.substack.com",
    ART: {
      door:  { front:"", monday:"", margins:"", field:"", library:"", scrap:"", lantern:"" },
      scene: { monday:"", margins:"", field:"", library:"", scrap:"", lantern:"" }
    }
  };

  /* ============ palette: one colour of paint per door ============ */
  var PAL = {
    front:  { door:"#1b2230", glow:"#bff3f8" },
    monday: { door:"#d98aa0", glow:"#ffe7c6" },
    margins:{ door:"#43528c", glow:"#ffe7a8" },
    field:  { door:"#2b8a97", glow:"#d2f6f9" },
    library:{ door:"#7fa58f", glow:"#effbe2" },
    scrap:  { door:"#de836b", glow:"#ffe3d6" },
    lantern:{ door:"#c8503b", glow:"#ffc47d" }
  };

  /* ============ the entry question + the rooms ============ */
  var ENTRY = {
    id:"front",
    q:{ id:"who", type:"single", text:"how do you experience my work?",
        opts:[["free","as a free reader"],["paid","as a paid patron"],["unsure","i'm honestly not sure which i am"]] }
  };

  var ROOMS = [
    {
      id:"monday", label:"monday magic", deco:{k:"cosmos",side:"r",w:96,rot:7},
      title:"monday magic",
      paras:["art, poetry, and small ruminations on ordinary magic. the kinds of things that invite you to dive deeper into your own ordinary life, or to explore life more creatively."],
      qs:[
        { id:"mon_habit", type:"single", tag:"first", text:"when it lands in your inbox, what happens?",
          opts:[["ritual","i read it slowly, like a small ritual"],["skim","i skim it when there's a gap in the day"],["later","i save it for later"],["forget","i honestly forget it's there"]] },
        { id:"mon_more", type:"multi", tag:"then", text:"what would you like more of in this room?",
          opts:[["poems","poems"],["art","paintings and visual pieces"],["rumin","short ruminations"],["prompts","small things to try"],["asis","it's right as it is"]] }
      ]
    },
    {
      id:"margins", label:"art in the margins", deco:{k:"hands",side:"l",w:104,rot:-4},
      title:"art in the margins of motherhood",
      paras:["a series on mothers who made art in and around raising children, in the margins, because the margins were all the room they had."],
      qs:[
        { id:"mar_fit", type:"single", tag:"first", text:"how does this series meet you?",
          opts:[["me","it's me. i'm a mother-maker too"],["window","i'm not a mother, but i find it really interesting to read about other artists"],["wall","i'd read it, but the paywall is in the way"],["notyet","i haven't really found it yet"]] },
        { id:"mar_more", type:"multi", tag:"then", text:"what would serve you most here?",

  /* ============ small helpers ============ */
  var stage = document.getElementById("stage");
  var count = document.getElementById("count");
  var hallBtn = document.getElementById("hallBtn");
  var portal = document.getElementById("portal");
  var TOTAL = ROOMS.length;
  var answers = {}, seen = {}, busy = false;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function h(tag, attrs){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if(v === null || v === undefined || v === false) return;
      if(k === "class") e.className = v;
      else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else if(v === true) e.setAttribute(k, "");
      else e.setAttribute(k, v);
    });
    for(var i = 2; i < arguments.length; i++){
      var kid = arguments[i];
      if(kid === null || kid === undefined || kid === false) continue;
      if(Array.isArray(kid)){ kid.forEach(function(x){ e.append(x.nodeType ? x : document.createTextNode(x)); }); }
      else e.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
    return e;
  }
  function fromHTML(s){ var t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; }

  function roomAnswered(r){
    return r.qs.some(function(q){
      var v = answers[q.id];
      return Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== "");
    });
  }
  function visitedCount(){ return ROOMS.filter(function(r){ return seen[r.id]; }).length; }
  function updateCount(){ count.textContent = visitedCount() + " of " + TOTAL + " doors"; }
  function setRoom(id){ document.documentElement.setAttribute("data-room", id || ""); }

  /* ============ the painted door ============ */
  var ARCH  = "M10 330 V112 A90 90 0 0 1 190 112 V330 Z";
  var FRAME = "M-2 330 V112 A102 102 0 0 1 202 112 V330 Z";

  function backSVG(id){
    return '<svg class="d-back" viewBox="-10 0 220 340" aria-hidden="true">'+
      '<defs><radialGradient id="gl-'+id+'" cx="50%" cy="62%" r="72%"><stop offset="0" style="stop-color:#fff;stop-opacity:.95"/><stop offset=".45" style="stop-color:var(--glow)"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:.65"/></radialGradient></defs>'+
      '<g filter="url(#rough)"><path d="'+FRAME+'" fill="var(--door)"/><path d="'+FRAME+'" fill="#0a0d14" opacity=".4"/></g>'+
      '<path d="'+ARCH+'" fill="url(#gl-'+id+')"/>'+
      '<path d="M100 330 L20 330 L60 150 Z" fill="#fff" opacity=".16"/>'+
      '<rect x="-6" y="330" width="212" height="8" fill="#14161a" opacity=".85"/>'+
      '</svg>';
  }
  function leafSVG(id){
    return '<svg class="d-leaf" viewBox="-10 0 220 340" aria-hidden="true">'+
      '<defs><clipPath id="cp-'+id+'"><path d="'+ARCH+'"/></clipPath></defs>'+
      '<g filter="url(#rough)"><path d="'+ARCH+'" fill="var(--door)"/></g>'+
      '<g clip-path="url(#cp-'+id+')" style="mix-blend-mode:multiply">'+
        '<ellipse cx="62" cy="96" rx="72" ry="52" fill="#fff" opacity=".4" filter="url(#soft)"/>'+
        '<ellipse cx="150" cy="300" rx="80" ry="60" fill="#000" opacity=".22" filter="url(#soft)"/>'+
        '<ellipse cx="170" cy="150" rx="40" ry="70" fill="#fff" opacity=".22" filter="url(#soft)"/>'+
      '</g>'+
      '<g filter="url(#rough)" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3"><path d="M30 60 V320"/><path d="M168 70 V320"/><path d="M100 24 V90"/></g>'+
      '<g filter="url(#rough)" fill="none" stroke-width="2"><path d="M44 170 V110 A56 56 0 0 1 156 110 V170 Z" stroke="#000" stroke-opacity=".2" transform="translate(2 2)"/><path d="M44 170 V110 A56 56 0 0 1 156 110 V170 Z" stroke="#fff" stroke-opacity=".5"/><path d="M44 194 H156 V300 H44 Z" stroke="#000" stroke-opacity=".2" transform="translate(2 2)"/><path d="M44 194 H156 V300 H44 Z" stroke="#fff" stroke-opacity=".5"/></g>'+
      '<circle class="port" cx="100" cy="116" r="24" style="fill:var(--glow)"/>'+
      '<circle cx="100" cy="116" r="24" fill="none" stroke="#14161a" stroke-opacity=".5" stroke-width="2"/>'+
      '<path d="M100 92 V140 M76 116 H124" stroke="#14161a" stroke-opacity=".35" stroke-width="2"/>'+
      '<circle cx="162" cy="238" r="7.5" fill="#f7f1de" stroke="#14161a" stroke-width="1.6"/><circle cx="162" cy="238" r="2" fill="#14161a"/>'+
      '</svg>';
  }
  function makeDoor(id, label, cls, asDiv){
    var pal = PAL[id], art = CFG.ART.door[id];
    var tag = asDiv ? "div" : "button";
    var inner = backSVG(id) + (art ? '<img class="d-leaf art" src="'+art+'" alt="">' : leafSVG(id)) + '<span class="seal" aria-hidden="true">✓</span>';
    var el = fromHTML('<'+tag+(asDiv?'':' type="button" aria-label="'+label+'"')+' class="door '+(cls||'')+'" style="--door:'+pal.door+';--glow:'+pal.glow+'">'+inner+'</'+tag+'>');
    return el;
  }

  /* ============ walking through a door: it swings, light floods, the next room appears ============ */
  function throughDoor(doorEl, id, next){
    if(busy) return;
    if(reduce || !portal.animate){ next(); return; }
    busy = true;
    var swapped = false, ended = false;
    function swap(){ if(swapped) return; swapped = true; try{ next(); }catch(e){ if(window.console) console.error(e); } }
    function end(){
      if(ended) return; ended = true;
      swap();
      try{ portal.getAnimations().forEach(function(an){ an.cancel(); }); }catch(e){}
      portal.style.display = "none";
      busy = false;
    }
    doorEl.classList.add("open");
    var r = doorEl.getBoundingClientRect();
    var x = r.left + r.width/2, y = r.top + r.height*0.55;
    portal.style.background = PAL[id].glow;
    portal.style.display = "block";
    setTimeout(function(){
      try{
        var a = portal.animate(
          [{clipPath:"circle(0px at "+x+"px "+y+"px)"},{clipPath:"circle(150vmax at "+x+"px "+y+"px)"}],
          {duration:650,easing:"cubic-bezier(.6,0,.9,.5)",fill:"forwards"});
        a.onfinish = function(){
          swap();
          try{
            var b = portal.animate([{opacity:1},{opacity:0}],{duration:800,easing:"ease-out",fill:"forwards"});
            b.onfinish = end;
          }catch(e){ end(); }
        };
      }catch(e){ end(); }
    }, 700);
    /* safety nets: never leave anyone stuck behind the light */
    setTimeout(swap, 1800);
    setTimeout(end, 3200);
  }

  hallBtn.addEventListener("click", function(){ if(currentRoom) viewHall(currentRoom.id); });

  function show(node, focusEl){
    node.classList.add("view");
    stage.replaceChildren(node);
    window.scrollTo(0, 0);
    updateCount();
    hallBtn.hidden = !currentRoom;
    var f = focusEl || node.querySelector("h1,h2");
    if(f){ f.setAttribute("tabindex","-1"); f.focus({preventScroll:true}); }
  }

  /* ============ questions: tags to pick, slips to write on ============ */
  function buildQuestion(q){
    var wrap, name = "q-" + q.id;
    if(q.type === "single" || q.type === "multi"){
      var multi = q.type === "multi";
      var box = h("div", {"class":"tags"});
      q.opts.forEach(function(o, i){
        var rot = (((i * 37 + q.id.length * 11) % 7) - 3) * 0.45;
        var btn = h("button", {type:"button", "class":"tag", "aria-pressed":"false"}, o[1]);
        var row = h("div", {"class":"tagrow", "data-v":o[0], style:"--r:"+rot+"deg"},
          h("span", {"class":"tagwrap"}, btn),
          h("span", {"class":"stamp", "aria-hidden":"true"}, "kept"));
        btn.addEventListener("click", function(){
          if(multi){
            var arr = answers[q.id] || [];
            var at = arr.indexOf(o[0]);
            if(at >= 0) arr.splice(at, 1); else arr.push(o[0]);
            answers[q.id] = arr;
          } else {
            answers[q.id] = (answers[q.id] === o[0]) ? undefined : o[0];
          }
          sync(box, q); refresh(); refreshSeal();
        });
        box.append(row);
      });
      wrap = h("fieldset", {"class":"q"},
        h("legend", {}, q.tag ? h("span", {"class":"tagline"}, q.tag) : null, q.text), box);
      sync(box, q);
    } else {
      var field = q.type === "text"
        ? h("textarea", {id:name, "class":"slip", rows:q.rows || 2, maxlength:600, placeholder:q.ph || ""})
        : h("input", {id:name, "class":"slip", type:"text", maxlength:160, placeholder:q.ph || "", autocomplete:"off"});
      field.value = answers[q.id] || "";
      field.addEventListener("input", function(){ answers[q.id] = field.value.trim(); refreshSeal(); });
      wrap = h("div", {"class":"q"},
        h("label", {"class":"qt", "for":name}, q.tag ? h("span", {"class":"tagline"}, q.tag) : null, q.text),
        field, q.hint ? h("p", {"class":"hint"}, q.hint) : null);
    }
    wrap.dataset.qid = q.id;
    return wrap;
  }
  function sync(box, q){
    var cur = answers[q.id];
    Array.prototype.forEach.call(box.children, function(row){
      var v = row.getAttribute("data-v");
      var on = Array.isArray(cur) ? cur.indexOf(v) >= 0 : cur === v;
      row.classList.toggle("on", on);
      row.querySelector(".tag").setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  var currentRoom = null;
  function refresh(){
    if(!currentRoom) return;
    currentRoom.qs.forEach(function(q){
      if(!q.show) return;
      var el = stage.querySelector('[data-qid="' + q.id + '"]');
      if(!el) return;
      var visible = q.show(answers);
      if(visible && el.hidden){
        el.hidden = false; el.classList.remove("reveal"); void el.offsetWidth; el.classList.add("reveal");
      } else if(!visible && !el.hidden){
        el.hidden = true; delete answers[q.id];
        var box = el.querySelector(".tags"); if(box) sync(box, q);
        var f = el.querySelector("textarea,input"); if(f) f.value = "";
      }
    });
  }
  function refreshSeal(){}

  /* ============ view: the front door ============ */
  function viewEntry(){
    currentRoom = null; setRoom("");
    var door = makeDoor("front", "open the front door", "idle", false);
    var go = function(){ throughDoor(door, "front", viewHall); };
    door.addEventListener("click", go);
    var q = buildQuestion(ENTRY.q);
    var node = h("section", {"class":"entry center"},
      h("h1", {style:"margin-top:30px"}, "an invitation to step into the luminarium."),
      h("p", {"class":"lede"}, "dear reader,"),
      h("p", {"class":"lede"}, "i've been sending things to you for quite some time now. you open them, you read them, and it means more than i know how to say, but i'm not always sure what's landing for you. and today i'd like to invite you on a little experience, to explore what i write about in a different way and to share with me what you love, what you need, and what you hope for when you open a missive from the luminarium."),
      h("div", {style:"width:min(64%,250px);margin:30px auto 24px"}, door),
      h("p", {"class":"lede"}, "so i've built a small house. each door represents something i make and share with you. behind each door you'll find a couple of questions, and i would love to hear your responses."),
      h("p", {"class":"lede quiet"}, "nothing is required. open as many doors as you like."),
      h("div", {style:"text-align:left"}, q),
      h("button", {type:"button", "class":"push", onclick:go}, "open the door"));
    show(node);
  }

  /* ============ view: the hall of doors ============ */
  function viewHall(from){
    currentRoom = null; setRoom("");
    var next = null;
    ROOMS.forEach(function(r){ if(!next && !seen[r.id] && !r.last) next = r.id; });
    var allOthers = ROOMS.filter(function(r){ return !r.last; }).every(function(r){ return seen[r.id]; });
    if(allOthers && !seen.lantern) next = "lantern";

    var closing = null;
    var cells = ROOMS.map(function(r, i){
      var cls = (seen[r.id] ? "visited " : "") + (roomAnswered(r) ? "answered " : "") + (next === r.id ? "beckon " : "") + (!seen[r.id] ? "idle" : "");
      var d = makeDoor(r.id, "open the door: " + r.label, cls, false);
      if(from === r.id){ closing = d; d.classList.add("open"); }
      d.addEventListener("click", function(){ throughDoor(d, r.id, function(){ viewRoom(i); }); });
      return h("div", {"class":"cell" + (r.last ? " last" : "")}, d,
        h("div", {"class":"plate"}, h("i", {}, r.last ? "last" : String(i + 1).padStart(2, "0")), r.label));
    });
    var lamps = h("div", {"class":"lamps", "aria-hidden":"true"}, ROOMS.map(function(r){ return h("span", {"class": seen[r.id] ? "lit" : ""}); }));
    var node = h("section", {"class":"center"},
      h("p", {"class":"mono", style:"margin-top:26px"}, "the hall"),
      h("h2", {}, "choose a door."),
      h("p", {"class":"lede"}, "six doors, open in any order. the lantern room at the end is where you can leave anything else."),
      lamps,
      h("div", {"class":"hall"}, cells));
    show(node);
    if(closing){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ closing.classList.remove("open"); }); });
    }
  }

  /* ============ view: inside a room ============ */
  function viewRoom(i){
    var r = ROOMS[i];
    currentRoom = r; seen[r.id] = true; setRoom(r.id);
    var pal = PAL[r.id];

    var sceneArt = CFG.ART.scene[r.id];
    var vista = h("div", {"class":"vista"});
    if(sceneArt){ vista.append(h("img", {src:sceneArt, alt:""})); }
    else { vista.innerHTML = '<svg viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + SCENES[r.id]() + '</svg>'; }

    var link = r.link ? h("p", {}, h("a", {"class":"linkbtn", href:CFG.SCRAP_URL, target:"_blank", rel:"noopener"}, r.link.text + " ↗")) : null;

    var primary = h("button", {type:"button", "class":"go", id:"goBtn"}, r.go || "close the door");
    primary.addEventListener("click", function(){ r.last ? submit() : viewHall(r.id); });
    var nav = h("div", {"class":"nav"},
      h("button", {type:"button", "class":"back", onclick:function(){ viewHall(r.id); }}, "back to the hall"),
      primary);

    var title = h("h2", {}, r.title);
    var tp = [["blue","green"],["green","grid"],["grid","blue"]][i % 3];
    var tw = {blue:104, green:104, grid:84};
    var deco = null;
    if(r.deco){
      deco = h("img", {"class":"deco " + (r.deco.block ? "blk" : r.deco.side), src:DECO[r.deco.k], alt:"", style:"width:"+r.deco.w+"px;--rot:"+r.deco.rot+"deg"});
    }
    var note = h("article", {"class":"note", id:"note"},
      h("img", {"class":"tape a", src:DECO["tape-"+tp[0]], alt:"", style:"width:"+tw[tp[0]]+"px"}),
      h("img", {"class":"tape b", src:DECO["tape-"+tp[1]], alt:"", style:"width:"+tw[tp[1]]+"px"}),
      deco,
      h("span", {"class":"mono"}, "room " + String(i + 1).padStart(2, "0") + " / " + r.label),
      title,
      r.paras.map(function(t){ return h("p", {}, t); }),
      link,
      r.qs.map(buildQuestion),
      h("div", {id:"msg", role:"status", "aria-live":"polite"}),
      nav);

    var node = h("section", {"class":"room", style:"--door:"+pal.door+";--glow:"+pal.glow}, vista, note);
    show(node, title);
    refresh();
  }

  /* ============ sending ============ */
  function flatten(){
    var out = {};
    Object.keys(answers).forEach(function(k){
      var v = answers[k];
      if(v === undefined || v === "" || (Array.isArray(v) && !v.length)) return;
      out[k] = Array.isArray(v) ? v.join(" | ") : v;
    });
    return out;
  }
  function submit(){
    var btn = document.getElementById("goBtn");
    var msg = document.getElementById("msg");
    var note = document.getElementById("note");
    msg.replaceChildren();
    btn.disabled = true;
    note.classList.add("sending");

    var payload = flatten();
    payload.rooms_visited = Object.keys(seen).join(" | ");
    payload.submitted_at = new Date().toISOString();

    var wait = new Promise(function(res){ setTimeout(res, reduce ? 0 : 900); });
    var send;
    if(!CFG.ENDPOINT){
      try{ localStorage.setItem("luminarium_preview", JSON.stringify(payload)); }catch(e){}
      if(window.console) console.log("luminarium preview (not sent):", payload);
      send = Promise.resolve();
    } else if(/script\.google(usercontent)?\.com/.test(CFG.ENDPOINT)){
      var form = new URLSearchParams();
      Object.keys(payload).forEach(function(k){ form.append(k, payload[k]); });
      send = fetch(CFG.ENDPOINT, { method:"POST", mode:"no-cors", body:form }).then(function(){});
    } else {
      send = fetch(CFG.ENDPOINT, {
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify(payload)
      }).then(function(res){ if(!res.ok) throw new Error("status " + res.status); });
    }
    Promise.all([send, wait]).then(function(){ viewThanks(!CFG.ENDPOINT); }).catch(function(){
      note.classList.remove("sending");
      btn.disabled = false;
      msg.append(h("p", {"class":"error"}, "your answers didn't send. check your connection and press the button again. nothing has been lost."));
    });
  }

  /* ============ view: thank you ============ */
  function viewThanks(preview){
    currentRoom = null; setRoom("lantern");
    var door = makeDoor("front", "", "open visited", true);
    var node = h("section", {"class":"center"},
      h("div", {style:"width:min(52%,210px);margin:36px auto 22px"}, door),
      h("h2", {}, "thank you for supporting my work."),
      h("p", {"class":"lede"}, "thank you for taking the time to walk through this with me today. whatever you shared will shape what comes next."),
      h("div", {style:"position:relative;display:inline-block;margin:6px 0"},
        h("img", {"class":"tape", src:DECO["tape-grid"], alt:"", style:"width:92px;left:-30px;top:-10px;transform:rotate(-10deg)"}),
        h("div", {"class":"poem"}, "there are tiny beautiful things", h("br"), "in the middle of long days", h("br"), "and dark nights,", h("br"), "tiny stellaria blossoms", h("br"), "opening like miniature", h("br"), "stars in the almost", h("br"), "green grass.", h("br"), "dandelions turning up", h("br"), "to the sun, little", h("br"), "explosions of yellow", h("br"), "lighting up corners and", h("br"), "deep ditches and", h("br"), "if i hold on to the", h("br"), "tiny beautiful things", h("br"), "i can imagine that", h("br"), "one day", h("br"), "everything", h("br"), "will", h("br"), "be", h("br"), "ok.")),
      h("p", {"class":"quiet"}, "raine"),
      h("div", {"style":"display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px"},
        h("a", {"class":"linkbtn", href:CFG.SUBSTACK_URL}, "back to the luminarium ↗"),
        h("button", {type:"button", "class":"back", onclick:function(){ viewHall(); }}, "wander again")),
      /[?&]test=1/.test(location.search) ? h("p", {"class":"note-preview"}, CFG.ENDPOINT ? "test: this page is set to send answers to your sheet." : "test: no sheet connected; this is the preview version.") : null,
      preview ? h("p", {"class":"note-preview"}, "preview mode: no endpoint is set, so nothing was sent. answers were logged to the browser console.") : null);
    show(node);
  }

  viewEntry();
})();
</script>
</body>
</html>
